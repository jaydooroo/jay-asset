[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # pandas 2.2 warns once that pyarrow will become required in pandas 3.
    ignore:\s*Pyarrow will become a required dependency:DeprecationWarning
    # datetime.utcnow() in backtest.py; harmless until Python removes it.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
